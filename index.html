<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1020">
<title>حِبر – مانغا ومانهوا</title>
<style>
:root{--bg:#0e1020;--pn:#171a30;--ln:#262a47;--tx:#eceef8;--mu:#8d92b3;--ac:#f2b544;--ok:#4cc38a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:400 15px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0e1020ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:26px;color:var(--ac)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--pn)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
h2{font-size:18px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;color:var(--mu);font-weight:400}
.mu{color:var(--mu)}
.feat{position:relative;border-radius:18px;overflow:hidden;min-height:250px;display:flex;align-items:flex-end;padding:18px;background:var(--pn)}
.feat .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(22px) brightness(.45);transform:scale(1.3)}
.feat .in{position:relative;display:flex;gap:16px;align-items:flex-end;width:100%}
.feat img{width:118px;border-radius:10px;box-shadow:0 10px 30px #0008}
.feat h1{font-size:26px;line-height:1.3;margin:4px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{font-size:12px;padding:2px 11px;border-radius:20px;border:1px solid var(--ln);background:#ffffff0d;color:var(--tx)}
.chip.on{background:var(--ac);color:#1b1608;border-color:var(--ac);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:#1b1608;font-weight:700;padding:9px 20px;border-radius:10px}
.btn.g{background:var(--pn);color:var(--tx);border:1px solid var(--ln)}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start;flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:block;position:relative}
.card img{width:100%;aspect-ratio:3/4;border-radius:10px;display:block;background:var(--pn)}
.card b{display:block;font-size:14px;margin-top:6px;line-height:1.4}
.card span{font-size:12px;color:var(--mu);display:block}
.card .nw{position:absolute;top:8px;right:8px;background:var(--ac);color:#1b1608;font-size:11px;font-weight:700;padding:0 8px;border-radius:6px}
.cont{width:260px;display:flex;gap:10px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px}
.cont img{width:56px;border-radius:6px;aspect-ratio:3/4}
.cont div{flex:1;min-width:0}
.cont b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:5px;background:var(--ln);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.rk{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
.rk em{font-style:normal;font-size:30px;font-weight:800;color:var(--ln);width:34px;text-align:center}
.rk:nth-child(-n+3) em{color:var(--ac)}
.rk img{width:52px;border-radius:6px;aspect-ratio:3/4}
.rk div{flex:1}
.rk b{display:block}
.rk small{color:var(--mu)}
.dt{position:relative;margin:-16px -16px 0;padding:16px;overflow:hidden}
.dt .bg{position:absolute;inset:0;background-size:cover;filter:blur(26px) brightness(.4);transform:scale(1.3)}
.dt .in{position:relative;display:flex;gap:16px}
.dt img{width:130px;border-radius:12px;align-self:flex-start;box-shadow:0 10px 30px #0008}
.dt h1{font-size:24px;line-height:1.3}
.acts{display:flex;gap:10px;margin:16px 0}
.acts .btn{flex:1;justify-content:center}
.story{white-space:pre-line;color:#c9cce3}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px}
.ch.rd{opacity:.55}
.ch small{color:var(--mu)}
input.s{width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;color:var(--tx);font:inherit;margin-bottom:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#12152a;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--mu)}
.tabs a.on{color:var(--ac)}
body.rdr .tabs,body.rdr .top{display:none}
body.rdr main{padding:0 0 30px;max-width:780px}
.rbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#0e1020f2;border-bottom:1px solid var(--ln)}
.rbar b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd img{width:100%;display:block}
.end{text-align:center;padding:24px 16px}
.end .acts{justify-content:center}
.av{width:72px;height:72px;border-radius:50%;background:var(--ln);margin:0 auto 10px;display:grid;place-items:center;font-size:30px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;width:max-content;max-width:90%;text-align:center}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--ac)}
a,button,label,.chip{touch-action:manipulation}
.tabs a{min-height:54px;justify-content:center}
.card{min-width:0}
.card b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.card span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{padding:6px 14px;font-size:13px;font-weight:600}
.lb{font-style:normal;font-size:10px;font-weight:700;color:#c9b2ff;background:#8b5cf624;border:1px solid #8b5cf6b3;border-radius:6px;padding:0 6px;margin-inline-end:4px;display:inline-block;line-height:1.6;vertical-align:middle}
.wc{background:linear-gradient(160deg,#1d2144,#12152a);border:1px solid var(--ln);border-radius:20px;padding:26px 20px;text-align:center}
.wl{font-weight:800;font-size:36px;color:var(--ac);line-height:1.2}
.wc .nm{justify-content:center;margin:10px 0 4px;font-size:21px}
.ft{list-style:none;padding:0;margin:18px 0;text-align:right}
.ft li{display:flex;gap:10px;align-items:center;padding:7px 0;color:#c9cce3;font-size:14px}
.ft svg{color:var(--ok);flex:0 0 auto}
.gb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.gg{font-weight:800;font-size:19px;color:#4285f4}
.fine{color:var(--mu);font-size:12px;margin-top:12px}
.ph{width:86px;height:86px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);margin:0 auto;display:block}
.ph.ini{display:grid;place-items:center;background:var(--ln);font-size:34px;font-weight:700}
.stats{display:flex;gap:10px;margin:18px 0}
.stats div{flex:1;background:#ffffff0a;border:1px solid var(--ln);border-radius:12px;padding:10px}
.stats b{display:block;font-size:24px;color:var(--ac)}
.stats span{font-size:12px;color:var(--mu)}
.pgerr{background:var(--pn);border:1px dashed var(--ln);border-radius:10px;padding:34px 16px;text-align:center;color:var(--mu);margin:8px 0}
.pgerr p{margin-bottom:10px}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#/">حِبر</a><a class="ib" href="#/x" aria-label="بحث"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a></header>
<main id="app"></main>
<noscript><p style="padding:20px">JavaScript is disabled.</p></noscript>
<nav class="tabs" id="tabs"></nav>
<div id="toast" role="status"></div>
<script>
addEventListener('error',function(e){var d=document.getElementById('app');if(d&&!d.innerHTML.trim())d.innerHTML='<p style="padding:20px;color:#f88;direction:ltr;font:13px monospace">JS error: '+String(e.message)+' (line '+e.lineno+')</p>'});
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== بيانات تجريبية (كلها أعمال وصور أصلية مولّدة بالكود) ===== */
const W=[
["ظلّ الفجر",["أكشن","فانتازيا"],4.9,2400000,"فريق الغروب",28,"في مدينة لا تشرق عليها الشمس منذ مئة عام، يكتشف صبي ورث سيفاً قديماً أن ظله يتحرك وحده. وللحقيقة التي يخفيها الظل ثمن لا يريد أحد دفعه.",12],
["مدينة الأجراس",["غموض","دراما"],4.7,1850000,"حبر الليل",212,"كلما رنّ جرس في المدينة اختفى شخص. تتبع محققة شابة الأصوات حتى برج لا يظهر على أي خريطة.",210],
["قهوة ما بعد المطر",["رومانسي","حياة يومية"],4.8,3100000,"سكّر زيادة",20,"مقهى صغير لا يفتح إلا حين تمطر. يلتقي فيه نادل خجول وكاتبة فقدت إلهامها، وتتغير حياتهما معاً بكوب واحد.",340],
["حارس البوصلة",["مغامرة","فانتازيا"],4.6,1200000,"فريق الغروب",31,"بوصلة لا تشير إلى الشمال بل إلى ما تتمناه. يبحر بها طاقم صغير نحو جزيرة تختفي كلما اقتربوا منها.",190],
["آخر رحلة للمريخ",["خيال علمي","دراما"],4.8,2750000,"محطة ٧",42,"قبل إغلاق آخر ممر إلى المريخ، يصعد عشرة غرباء إلى المركبة نفسها. لكل منهم سبب للهروب من الأرض، ولا أحد يقول الحقيقة.",265],
["مدرسة الأرواح الصغيرة",["كوميدي","خارق"],4.5,980000,"شاي بالنعناع",65,"تقبل المدرسة الجديدة الأرواح الضائعة فقط. وأول طالب بشري فيها يتنكر ليصير مدرّسهم الجديد.",100],
["سيف الغروب",["أكشن","تاريخي"],4.7,1600000,"حبر الليل",54,"في زمن الممالك المتحاربة، حداد عجوز يصنع سيفاً أخيراً، ويصير سره سبباً لحرب لا يريدها.",355],
["نادي الأحلام المنسية",["دراما","رومانسي"],4.6,870000,"سكّر زيادة",18,"نادٍ مدرسي يجمع الأحلام التي تخلى عنها أصحابها. وحين تطلب فتاة استعادة حلمها يكتشف الأعضاء ما ضاع منهم هم أيضاً.",300],
["بوابة الألف باب",["فانتازيا","غموض"],4.9,3400000,"محطة ٧",97,"في قصر بألف باب، كل باب يفتح على عالم. وحارسة صغيرة تحمل المفتاح الوحيد الذي لا يعمل إلا مرة واحدة.",255],
["طاهي السماء",["كوميدي","حياة يومية"],4.4,640000,"شاي بالنعناع",37,"مطعم يطير فوق الغيوم، وطاهيه يحاول إرضاء زبائن لا يأكلون إلا ما لم يُطبخ بعد.",45]
].map((a,i)=>({id:'m'+i,ix:i,t:a[0],g:a[1],r:a[2],v:a[3],tm:a[4],n:a[5],s:a[6],h:a[7],d:(i*2)%9}));
const G=[...new Set(W.flatMap(w=>w.g))];

const $=s=>document.querySelector(s),app=$('#app');
const nf=n=>n.toLocaleString('ar-EG');
const ago=d=>d<=0?'اليوم':d==1?'أمس':'قبل '+nf(d)+' يوم';
const vw=n=>n>=1e6?nf(+(n/1e6).toFixed(1))+' مليون':nf(Math.round(n/1e3))+' ألف';
let st={fav:['m1','m6'],pr:{m0:{c:12,p:60},m3:{c:5,p:30},m4:{c:21,p:85}}};
try{const s=JSON.parse(localStorage.getItem('hibr'));if(s&&typeof s==='object')st=Object.assign({},st,s);if(!Array.isArray(st.fav))st.fav=[];if(!st.pr||typeof st.pr!=='object')st.pr={};st.fav=st.fav.map(k=>typeof k==='number'?'m'+k:k);Object.keys(st.pr).forEach(k=>{if(/^\d+$/.test(k)){st.pr['m'+k]=st.pr[k];delete st.pr[k]}})}catch(e){}
const save=q=>{if(!q)st.ts=Date.now();try{localStorage.setItem('hibr',JSON.stringify(st))}catch(e){}if(!q)syncUp()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),m.length>40?5000:2600)};
const U=s=>'data:image/svg+xml,'+encodeURIComponent(s);
const X='xmlns="http://www.w3.org/2000/svg"';

/* غلاف أصلي مولّد */
const CV={};
function C(w){return w.cover||CV[w.id]||(CV[w.id]=(()=>{const h=w.h,i=w.ix||0;
let s=`<svg ${X} viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 70% 40%)"/><stop offset="1" stop-color="hsl(${(h+60)%360} 70% 12%)"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/>`;
for(let k=0;k<5;k++)s+=`<circle cx="${(i*53+k*97)%300}" cy="${(i*31+k*131)%400}" r="${30+((i+k)*29)%90}" fill="hsl(${h+k*20} 80% ${50+k*4}%)" opacity=".16"/>`;
s+=`<path d="M-20 ${250+i*9}L320 ${110+i*5}L320 ${160+i*5}L-20 ${310+i*9}Z" fill="#fff" opacity=".09"/>`;
s+=`<circle cx="150" cy="125" r="${48+i%3*10}" fill="none" stroke="#f2b544" stroke-width="4"/><circle cx="150" cy="125" r="${16+i%4*5}" fill="#f2b544"/>`;
const wd=w.t.split(' '),m=Math.ceil(wd.length/2),L=wd.length>1?[wd.slice(0,m).join(' '),wd.slice(m).join(' ')]:[w.t],fs=Math.max(...L.map(x=>x.length))>9?30:38;
L.forEach((x,k)=>s+=`<text x="150" y="${235+k*(fs+8)}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="#fff">${x}</text>`);
s+=`<rect y="335" width="300" height="65" fill="#000" opacity=".35"/><text x="150" y="374" font-size="16" text-anchor="middle" fill="#ffffffcc">${w.tm}</text></svg>`;
return U(s)})())}

/* صفحة فصل تجريبية أصلية */
function PG(w,c,p){const h=w.h;
const R=[[[30,30,740,420],[30,470,360,340],[410,470,360,340],[30,830,740,340]],[[30,30,360,560],[410,30,360,270],[410,320,360,270],[30,610,740,560]],[[30,30,740,300],[30,350,740,420],[30,790,360,380],[410,790,360,380]]][p%3];
let s=`<svg ${X} viewBox="0 0 800 1200"><defs><pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#1a1a24"/></pattern></defs><rect width="800" height="1200" fill="#f5f2ea"/>`;
R.forEach(([x,y,a,b],k)=>{const m=(k+p+c)%4,cx=a/2,cy=b/2;
let q=`<rect width="${a}" height="${b}" fill="hsl(${h+k*14} 35% ${m==1?32:88}%)"/>`;
if(m==0){for(let j=0;j<36;j++){const t=j*Math.PI/18;q+=`<line x1="${cx+Math.cos(t)*60}" y1="${cy+Math.sin(t)*60}" x2="${cx+Math.cos(t)*900}" y2="${cy+Math.sin(t)*900}" stroke="#1a1a24" stroke-width="${2+j%3*2}"/>`}q+=`<circle cx="${cx}" cy="${cy}" r="55" fill="#f5f2ea"/>`}
if(m==1)q+=`<polygon points="0,${b} 0,${b*.55} ${a*.3},${b*.3} ${a*.5},${b*.6} ${a*.75},${b*.2} ${a},${b*.5} ${a},${b}" fill="#0c0d16"/><circle cx="${a*.78}" cy="${b*.22}" r="${b*.1}" fill="#f2b544"/>`;
if(m==2)q+=`<rect width="${a}" height="${b}" fill="url(#d)" opacity=".3"/><circle cx="${cx}" cy="${cy}" r="${Math.min(a,b)*.3}" fill="none" stroke="#1a1a24" stroke-width="10"/><text x="${cx}" y="${cy+40}" font-size="120" font-weight="800" text-anchor="middle" fill="#1a1a24">!</text>`;
if(m==3)q+=`<rect y="${b*.6}" width="${a}" height="${b*.4}" fill="url(#d)" opacity=".35"/><ellipse cx="${cx}" cy="${b*.36}" rx="${a*.24}" ry="${b*.18}" fill="#fff" stroke="#1a1a24" stroke-width="5"/><text x="${cx}" y="${b*.38}" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a24">الفصل ${nf(c)} – صفحة ${nf(p+1)}</text>`;
s+=`<svg x="${x}" y="${y}" width="${a}" height="${b}">${q}</svg><rect x="${x}" y="${y}" width="${a}" height="${b}" fill="none" stroke="#0c0d16" stroke-width="6"/>`});
return U(s+'</svg>')}

/* قطع واجهة */
const card=(w,nw)=>`<a class="card" href="#/m/${w.id}">${nw?'<i class="nw">جديد</i>':''}<img loading="lazy" src="${C(w)}" alt=""><b>${w.t}</b><span>${w.lang==='en'?'<i class="lb">إنجليزي</i> ':''}${w.g.join('، ')}</span>${nw&&w.n?`<span>الفصل ${nf(w.n)}، ${ago(w.d)}</span>`:''}</a>`;
const back=`<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;
const chips=g=>`<div class="chips">${g.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;

/* الصفحات */
function home(){const pop=[...W].sort((a,b)=>b.v-a.v||a.d-b.d).slice(0,5),f=pop[0],lt=[...W].sort((a,b)=>a.d-b.d).slice(0,6);
const cont=Object.keys(st.pr).map(k=>[gw(k),st.pr[k]]).filter(x=>x[0]);
app.innerHTML=`<a class="feat" href="#/m/${f.id}"><div class="bg" style="background-image:url('${C(f)}')"></div><div class="in"><img src="${C(f)}" alt=""><div><span class="mu">عمل الأسبوع</span><h1>${f.t}</h1>${chips(f.g)}<span class="btn">ابدأ القراءة</span></div></div></a>
${cont.length?`<h2>استكمل القراءة</h2><div class="row">${cont.map(([w,p])=>`<a class="cont" href="#/r/${w.id}/${p.c}"><img src="${C(w)}" alt=""><div><b>${w.t}</b><small class="mu">الفصل ${nf(p.c)}</small><div class="bar"><i style="width:${p.p}%"></i></div></div></a>`).join('')}</div>`:''}
<h2>أحدث الأعمال <small>حُدّثت مؤخراً</small></h2><div class="grid">${lt.map(w=>card(w,1)).join('')}</div>
<h2>أشهر المانغا</h2>${pop.map((w,i)=>`<a class="rk" href="#/m/${w.id}"><em>${nf(i+1)}</em><img src="${C(w)}" alt=""><div><b>${w.t}</b><small>${w.lang==='en'?'<i class="lb">إنجليزي</i> ':''}${w.g.join('، ')}</small></div>${w.v?`<small>${vw(w.v)} مشاهدة</small>`:''}</a>`).join('')}`;
}

const gw=id=>W.find(x=>x.id===id);
const prune=()=>{st.fav=st.fav.filter(k=>typeof k==='string'&&gw(k));Object.keys(st.pr).forEach(k=>{if(!gw(k))delete st.pr[k]});save(true)};
function detail(id){const w=gw(id);if(!w){app.innerHTML='<p class="empty">العمل غير موجود.</p>';return}document.title=((w.rw&&w.rw.t)||w.t)+' | حِبر';const p=st.pr[id],fav=st.fav.includes(id),cs=chList(w,id);if(FB.on&&w.fid&&!FB.ch[id])FB.chap(id);
app.innerHTML=`<div class="dt"><div class="bg" style="background-image:url('${C(w)}')"></div><a class="ib" style="position:relative;margin-bottom:12px" href="${lastTab}" aria-label="رجوع">${back}</a>
<div class="in"><img src="${C(w)}" alt=""><div><h1>${w.t}</h1><p class="mu">ترجمة: ${w.tm}</p>${w.lang==='en'?'<i class="lb">إنجليزي</i>':''}<p>${w.r||w.v?'★ '+nf(w.r)+' · '+vw(w.v)+' مشاهدة':''}</p>${chips(w.g)}<span class="mu">مستمرة · ${nf(w.n)} فصل</span></div></div></div>
<div class="acts">${cs.length||!w.fid?`<a class="btn" href="#/r/${id}/${p?p.c:(cs.length?Math.min(...cs):1)}">${p?'تابع الفصل '+nf(p.c):'ابدأ القراءة'}</a>`:''}<button class="btn g" data-act="fav" data-id="${id}" aria-label="المفضلة">${fav?'♥ في المكتبة':'♡ أضف للمكتبة'}</button></div>
<h2>القصة</h2><p class="story">${w.s}</p>
<h2>الفصول <small>${nf(w.n)} فصل</small></h2>${cs.map(c=>`<a class="ch ${p&&c<p.c?'rd':''}" href="#/r/${id}/${c}"><b>الفصل ${nf(c)}</b><small>${ago(w.fid?w.d:w.d+(w.n-c)*6)}</small></a>`).join('')}`;
}

let SV=0,RSK=0;
function reader(id,c){const w=gw(id);if(!w){app.innerHTML='<p class="empty">العمل غير موجود.</p>';return}c=+c;if(FB.on&&w.fid&&!FB.ch[id])FB.chap(id);
document.title=((w.rw&&w.rw.t)||w.t)+' - الفصل '+nf(c)+' | حِبر';
const o=st.pr[id],sv=o&&o.c===c?o.p:0;st.pr[id]={c,p:sv||5,t:Date.now()};save();document.body.classList.add('rdr');
const cl=[...chList(w,id)].sort((a,b)=>a-b),i=cl.indexOf(c),pvN=i>0?cl[i-1]:null,nxN=i>=0&&i<cl.length-1?cl[i+1]:null,pg=rp(w,id,c),ldg=FB.ch[id]&&!FB.ch[id].length;
const pv=pvN!==null?`<a class="btn g" href="#/r/${id}/${pvN}">السابق</a>`:'',nx=nxN!==null?`<a class="btn" href="#/r/${id}/${nxN}">الفصل التالي</a>`:'';
app.innerHTML=`<div class="rbar"><a class="ib" href="#/m/${id}" aria-label="رجوع">${back}</a><b>${w.t} – الفصل ${nf(c)}</b></div>
<div class="rd">${pg.length?pg.map(u=>`<img loading="lazy" src="${u}"${u.startsWith('data:')?'':` data-u="${u}"`} alt="">`).join(''):`<p class="empty">${ldg?'جارٍ التحميل…':'لا توجد صفحات لهذا الفصل.'}</p>`}</div>
<div class="end"><p class="mu">نهاية الفصل ${nf(c)}${w.fid?'':' (صفحات تجريبية)'}</p><div class="acts">${pv}${nx}</div><a class="mu" href="#/m/${id}">العودة إلى صفحة العمل</a></div>`;
if(sv>8&&sv<97&&pg.length)resume(sv);
onscroll=()=>{if(RSK)return;clearTimeout(SV);SV=setTimeout(()=>{if(!st.pr[id])return;st.pr[id].p=Math.min(100,Math.round(scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100)||5);st.pr[id].t=Date.now();save()},500)};
}

function explore(){let q='',g='';
const draw=()=>{const r=W.filter(w=>(!g||w.g.includes(g))&&(!q||w.t.includes(q)));
$('#res').innerHTML=r.length?r.map(w=>card(w)).join(''):'<p class="empty">لا توجد نتائج. جرّب كلمة أخرى أو تصنيفاً مختلفاً.</p>'};
app.innerHTML=`<input class="s" id="q" placeholder="ابحث عن عمل" type="search"><div class="chips" id="gs"><button class="chip on" data-g="">الكل</button>${G.map(x=>`<button class="chip" data-g="${x}">${x}</button>`).join('')}</div><div class="grid" id="res" style="margin-top:14px"></div>`;
$('#q').oninput=e=>{q=e.target.value.trim();draw()};
$('#gs').onclick=e=>{const b=e.target.closest('button');if(!b)return;g=b.dataset.g;document.querySelectorAll('#gs .chip').forEach(x=>x.classList.toggle('on',x===b));draw()};draw();
}

function lib(){const f=st.fav.map(gw).filter(Boolean);
app.innerHTML=`<h2 style="margin-top:6px">مكتبتي <small>${nf(f.length)} عمل</small></h2>${f.length?`<div class="grid">${f.map(w=>card(w)).join('')}</div>`:'<p class="empty">مكتبتك فارغة. افتح أي عمل واضغط على أضف للمكتبة.</p>'}`}

/* ===== التنقل والأحداث ===== */
let cur='',lastTab='#/';
const A={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tabs(){
$('#tabs').innerHTML=[['#/','h','الرئيسية','<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'],['#/x','x','استكشف','<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'],['#/l','l','مكتبتي','<path d="M6 3h12v18l-6-4-6 4z"/>'],['#/u','u','حسابي','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>']].map(([h,t,l,p])=>`<a href="${h}" data-t="${t}"><svg class="i" viewBox="0 0 24 24">${p}</svg>${l}</a>`).join('')}
function go(h){if(h===location.hash||(h==='#/'&&!location.hash)){route();return}location.hash=h;setTimeout(()=>{if(cur!==location.hash)route()},80)}
function gate(){if(!FB.ready)return'<p class="empty">جارٍ التحميل…</p>';
if(FB.err)return'<p class="empty">تعذّر تحميل الأعمال. تحقق من اتصالك ثم حاول مجدداً.</p><p class="empty"><button class="btn" data-act="retry">إعادة المحاولة</button></p>';
if(!W.length)return'<p class="empty">لا توجد أعمال منشورة بعد. عُد قريباً!</p>';return''}
function route(){const hs=location.hash||'#/';cur=location.hash;const [p,a,b]=hs.slice(2).split('/');
document.body.classList.remove('rdr');onscroll=null;clearTimeout(SV);RSK=0;scrollTo(0,0);
if(p!=='m'&&p!=='r')lastTab=hs;
const t={m:'h',x:'x',l:'l',u:'u'}[p]||(p==='r'?'':'h');
document.title={x:'استكشف | حِبر',l:'مكتبتي | حِبر',u:'حسابي | حِبر'}[p]||'حِبر – مانغا ومانهوا';
document.querySelectorAll('#tabs a').forEach(e=>e.classList.toggle('on',e.dataset.t===t));
if(FB.cfg&&p!=='u'){const g=gate();if(g){app.innerHTML=g;return}}
try{({m:()=>detail(a),r:()=>reader(a,b),x:explore,l:lib,u:prof}[p]||home)()}
catch(e){app.innerHTML='<p class="empty">تعذّر فتح الصفحة.</p><p class="empty"><a class="btn" href="#/">العودة للرئيسية</a></p>'}}

/* ===== حسابي + المزامنة ===== */
let SY=0;
function pushSt(){if(!FB.on||!FB.user||FB.sy!==FB.user.uid)return;FB.db.collection('users').doc(FB.user.uid).set({fav:st.fav,pr:st.pr,ts:st.ts||Date.now()}).catch(()=>{})}
function syncUp(now){if(!FB.on||!FB.user||FB.sy!==FB.user.uid)return;clearTimeout(SY);SY=setTimeout(pushSt,now?0:8000)}
async function syncDown(){const u=FB.user;if(!u)return;
try{const d=await FB.db.collection('users').doc(u.uid).get();if(FB.user!==u)return;const r=d.exists?d.data():null;
if(r){const rf=Array.isArray(r.fav)?r.fav.filter(k=>typeof k==='string'):[],rp=r.pr&&typeof r.pr==='object'?r.pr:{};
if(st.sy!==u.uid){st.fav=[...new Set([...rf,...st.fav])];Object.keys(rp).forEach(k=>{const a=st.pr[k],b=rp[k];if(b&&typeof b==='object'&&(!a||(b.t||0)>(a.t||0)))st.pr[k]=b})}
else if((r.ts||0)>(st.ts||0)){st.fav=rf;st.pr=rp}}
st.sy=u.uid;FB.sy=u.uid;prune();pushSt();if(/^#\/(u|l|)$/.test(location.hash))route()}catch(e){}}
function prof(){const u=FB.user,ld=FB.cfg&&!FB.ready;document.title='حسابي | حِبر';
const clr='<div style="text-align:center;margin-top:14px"><button class="btn g sm" data-act="clr">مسح البيانات المحفوظة</button></div>';
if(u){const raw=u.displayName||(u.email||'').split('@')[0]||'قارئ',nm=esc(raw),ph=/^https:\/\/[^\s'"()<>]+$/.test(u.photoURL||'')?u.photoURL:'',
n=ld?'—':nf(st.fav.filter(gw).length),r=ld?'—':nf(Object.keys(st.pr).filter(gw).length);
app.innerHTML=`<div class="wc">${ph?`<img class="ph" src="${ph}" referrerpolicy="no-referrer" alt="">`:`<div class="ph ini">${esc([...raw][0]||'ق')}</div>`}<h2 class="nm">${nm}</h2><p class="mu" dir="ltr">${esc(u.email||'')}</p><div class="stats"><div><b>${n}</b><span>في المكتبة</span></div><div><b>${r}</b><span>قيد القراءة</span></div></div><button class="btn g" data-act="out" style="width:100%;justify-content:center">تسجيل الخروج</button></div>`+clr}
else app.innerHTML=`<div class="wc"><div class="wl">حِبر</div><h2 class="nm">أهلاً بك في حِبر</h2><p class="mu">سجّل دخولك لتبقى مكتبتك وتقدّمك معك أينما قرأت.</p><ul class="ft">${['احفظ أعمالك المفضلة في مكتبة واحدة','تابع القراءة من حيث توقفت على أي جهاز','مزامنة تلقائية مع حسابك'].map(t=>`<li><svg class="i" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>${t}</li>`).join('')}</ul><button class="gb" data-act="login"><span class="gg">G</span>المتابعة باستخدام Google</button><p class="fine">نستخدم حسابك لحفظ المفضلة والتقدّم فقط.</p></div>`+clr}
const bust=u=>u+(u.includes('?')?'&':'?')+'r='+Date.now();
function resume(p){RSK=1;const ev=['touchstart','wheel','keydown','mousedown'],imgs=[...document.querySelectorAll('.rd img')];let n=0;
const stop=()=>{RSK=0;ev.forEach(e=>removeEventListener(e,stop))},go=()=>{const h=document.body.scrollHeight-innerHeight;if(h>0)scrollTo(0,h*p/100)},
done=()=>{go();if(++n>=imgs.length)setTimeout(stop,400)};
ev.forEach(e=>addEventListener(e,stop,{passive:true}));
imgs.forEach(im=>{im.loading='eager';if(im.complete&&im.naturalWidth)done();else{im.addEventListener('load',done);im.addEventListener('error',done)}});
setTimeout(stop,10000)}
document.addEventListener('error',e=>{const t=e.target;if(!t||t.tagName!=='IMG'||!t.dataset||!t.dataset.u||!t.closest('.rd'))return;
const d=document.createElement('div');d.className='pgerr';d.dataset.u=t.dataset.u;d.innerHTML='<p>تعذّر تحميل الصفحة</p><button class="btn g sm" data-act="rt">إعادة المحاولة</button>';t.replaceWith(d)},true);
A.rt=(d,b)=>{const c=b.closest('.pgerr');if(!c)return;const im=document.createElement('img');im.alt='';im.dataset.u=c.dataset.u;im.src=bust(c.dataset.u);c.replaceWith(im)};
A.login=()=>toast('تسجيل الدخول غير متاح في النسخة التجريبية');
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')syncUp(true)});
A.retry=()=>{if(!FB.on){location.reload();return}FB.err=0;FB.ready=0;route();FB.load()};
A.toast=d=>toast(d.m);
A.fav=d=>{const id=d.id,i=st.fav.indexOf(id);i<0?st.fav.push(id):st.fav.splice(i,1);save();toast(i<0?'أُضيف إلى مكتبتك':'أُزيل من مكتبتك');detail(id)};
A.clr=()=>{if(!confirm('سيُمسح تقدّم القراءة والمكتبة المحفوظان على هذا الجهاز (تعود من حسابك إن كنتَ مسجّلاً). متابعة؟'))return;try{localStorage.clear()}catch(e){}location.reload()};

document.addEventListener('click',e=>{
const l=e.target.closest('a[href^="#"]');if(l){e.preventDefault();go(l.getAttribute('href'));return}
const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset,b)});
addEventListener('hashchange',()=>{if(location.hash!==cur)route()});

/* ===== Firebase (اختياري): ضع بيانات مشروعك هنا. إن بقيت فارغة تعمل البيانات التجريبية ===== */
const firebaseConfig={
  apiKey:"AIzaSyDAcTue-ZFjOwxI2kyKFGoL75vDYKO2nEg",
  authDomain:"hibr-manga-cb38e.firebaseapp.com",
  projectId:"hibr-manga-cb38e",
  storageBucket:"hibr-manga-cb38e.firebasestorage.app",
  messagingSenderId:"690799413854",
  appId:"1:690799413854:web:742e92e19190a4113b42cf",
  measurementId:"G-827SCTXS73"
};
const FB={on:false,db:null,au:null,user:null,ch:{}};
const chList=(w,id)=>FB.ch[id]?FB.ch[id].map(k=>k.num):w.fid?[]:[...Array(w.n)].map((_,i)=>w.n-i);
const rp=(w,id,c)=>{const x=FB.ch[id]&&FB.ch[id].find(k=>k.num===c);return x&&x.pages&&x.pages.length?x.pages:w.fid?[]:[0,1,2,3,4,5].map(p=>PG(w,c,p))};
FB.chap=async id=>{const w=gw(id);if(!w)return;FB.ch[id]=[];try{
const q=await FB.db.collection('works').doc(w.fid).collection('chapters').orderBy('num','desc').get(),r=[];
q.forEach(d=>{const x=d.data();r.push({num:+x.num,pages:(Array.isArray(x.pages)?x.pages:[]).filter(u=>/^https:\/\/[^\s'"<>]+$/.test(u))})});
if(!r.length){delete FB.ch[id];FB.ch[id]=null;return}
FB.ch[id]=r;w.n=Math.max(...r.map(k=>k.num));if(/^#\/[mr]\//.test(location.hash))route()}catch(e){FB.ch[id]=null}};
FB.load=async()=>{try{const q=await FB.db.collection('works').get(),r=[];
q.forEach(d=>{const x=d.data();r.push({fid:d.id,t:esc(x.title||''),g:(Array.isArray(x.genres)?x.genres:[]).map(esc),r:+x.rating||0,v:+x.views||0,tm:esc(x.team||''),n:+x.chapters||0,s:esc(x.story||''),h:+x.hue||0,d:x.updatedAt&&x.updatedAt.toMillis?Math.max(0,Math.floor((Date.now()-x.updatedAt.toMillis())/864e5)):+x.daysAgo||0,cover:/^https:\/\/[^\s'"()<>]+$/.test(x.cover||'')?x.cover:'',lang:x.lang==='en'?'en':'ar',rw:{t:x.title||'',g:Array.isArray(x.genres)?x.genres:[],s:x.story||'',tm:x.team||''},ts:x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():0})});
if(!r.length){W.length=0;G.length=0;FB.ch={};prune();FB.ready=1;FB.err=0;route();return}r.sort((a,b)=>a.ts-b.ts||(a.fid<b.fid?-1:1));r.forEach((w,i)=>{w.ix=i;w.id=w.fid});W.length=0;W.push(...r);G.length=0;G.push(...new Set(W.flatMap(w=>w.g)));
prune();FB.ch={};FB.ready=1;FB.err=0;route()}catch(e){FB.ready=1;if(!W.length)FB.err=1;toast('تعذّر تحميل البيانات من Firebase');route()}};
FB.init=()=>{const has=!!(firebaseConfig.apiKey&&firebaseConfig.projectId);if(has){FB.cfg=1;W.length=0;G.length=0}try{
if(!has)return;if(!window.firebase){FB.ready=1;FB.err=1;return}
firebase.initializeApp(firebaseConfig);FB.au=firebase.auth();FB.db=firebase.firestore();FB.on=true;tabs();
const er=e=>toast('تعذّر تنفيذ العملية: '+(e&&e.code||''));
A.login=async()=>{const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
try{await FB.au.signInWithPopup(pr)}catch(e){const c=e&&e.code;
if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await FB.au.signInWithRedirect(pr)}catch(x){er(x)}}
else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')er(e)}};
A.out=async()=>{try{await FB.au.signOut();st.fav=[];st.pr={};st.sy=null;st.ts=0;save(true);toast('تم تسجيل الخروج')}catch(e){er(e)}};
FB.au.onAuthStateChanged(u=>{FB.user=u;FB.sy=null;clearTimeout(SY);tabs();if(u)syncDown();if(location.hash==='#/u')route()});
FB.load()}catch(e){FB.on=false;FB.ready=1;FB.err=1}};
FB.init();tabs();route();
</script>
